# Dependency update visibility, for the GitHub Actions of the workflows only, once a month. Nothing
# here changes the build: Dependabot opens a pull request, CI judges it on both platforms like any
# other, and a human merges or closes.
#
# Maven and npm are deliberately not watched. Almost every update their trees need is a migration
# rather than a bump (Vert.x 4, react-scripts 5, Node), which Dependabot cannot do, and the CRA 3 npm
# tree would open a steady stream of pull requests that a project in maintenance has no one to
# review. Dependabot alerts, enabled in the repository settings, give the visibility without them.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
